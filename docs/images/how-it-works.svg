<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How PropSense works</title>
  <desc id="d">Entity facts feed a rule's selector. The selected entities go to the rule's actions: expose to assistants, sync a group, apply a label, schedule, show on a dashboard, and more.</desc>
  <rect width="900" height="380" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="30" y="40" font-size="13" font-weight="600" fill="#57606a">WHAT HOME ASSISTANT KNOWS</text>
  <g font-size="14" fill="#1f2328">
    <rect x="30" y="56" width="200" height="40" rx="8" fill="#ddf4ff" stroke="#54aeff"/><text x="46" y="81">Labels, areas, floors</text>
    <rect x="30" y="106" width="200" height="40" rx="8" fill="#ddf4ff" stroke="#54aeff"/><text x="46" y="131">Integration, model, name</text>
    <rect x="30" y="156" width="200" height="40" rx="8" fill="#ddf4ff" stroke="#54aeff"/><text x="46" y="181">Capabilities, categories</text>
    <rect x="30" y="206" width="200" height="40" rx="8" fill="#ddf4ff" stroke="#54aeff"/><text x="46" y="231">State and attributes</text>
  </g>

  <path d="M236 150 H300" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <text x="320" y="40" font-size="13" font-weight="600" fill="#57606a">ONE RULE</text>
  <rect x="320" y="56" width="250" height="190" rx="12" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="340" y="90" font-size="16" font-weight="600" fill="#1f2328">Selector</text>
  <text x="340" y="114" font-size="13" fill="#57606a">include: label "Outdoor"</text>
  <text x="340" y="134" font-size="13" fill="#57606a">and domain: switch</text>
  <text x="340" y="154" font-size="13" fill="#57606a">exclude: area "Garage"</text>
  <line x1="340" y1="172" x2="550" y2="172" stroke="#d4a72c"/>
  <text x="340" y="200" font-size="16" font-weight="600" fill="#1f2328">Actions (one or more)</text>
  <text x="340" y="224" font-size="13" fill="#57606a">all share the same selection</text>

  <path d="M576 150 H640" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <text x="660" y="40" font-size="13" font-weight="600" fill="#57606a">WHAT IT DOES WITH THEM</text>
  <g font-size="14" fill="#1f2328">
    <rect x="660" y="56" width="210" height="34" rx="8" fill="#dafbe1" stroke="#4ac26b"/><text x="676" y="78">Expose to voice assistants</text>
    <rect x="660" y="98" width="210" height="34" rx="8" fill="#dafbe1" stroke="#4ac26b"/><text x="676" y="120">Keep a group in sync</text>
    <rect x="660" y="140" width="210" height="34" rx="8" fill="#dafbe1" stroke="#4ac26b"/><text x="676" y="162">Apply a label or alias</text>
    <rect x="660" y="182" width="210" height="34" rx="8" fill="#dafbe1" stroke="#4ac26b"/><text x="676" y="204">Timers and schedules</text>
    <rect x="660" y="224" width="210" height="34" rx="8" fill="#dafbe1" stroke="#4ac26b"/><text x="676" y="246">Dashboards, by audience</text>
    <rect x="660" y="266" width="210" height="34" rx="8" fill="#dafbe1" stroke="#4ac26b"/><text x="676" y="288">Metrics, Repairs, run actions</text>
  </g>

  <text x="30" y="338" font-size="14" fill="#1f2328">Rules are the single source of truth. When a label, area or state changes, PropSense re-checks the rules</text>
  <text x="30" y="358" font-size="14" fill="#1f2328">and brings each action back in line with them. A dry run shows the changes before anything is applied.</text>
</svg>
